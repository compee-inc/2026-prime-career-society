<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — 2026 PRIVATE DATING</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── 비밀번호 잠금 화면 ── */
    #lock-screen {
      position: fixed;
      inset: 0;
      background: #0c0c0c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      z-index: 999;
    }
    #lock-screen h1 {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #C9A35B;
    }
    #lock-screen p {
      font-size: 0.68rem;
      color: #9C988F;
      letter-spacing: 0.08em;
    }
    #lock-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      width: 260px;
    }
    #lock-input {
      width: 100%;
      background: #161616;
      border: 1px solid rgba(201,163,91,0.3);
      color: #F3EEE4;
      font-size: 1rem;
      letter-spacing: 0.2em;
      text-align: center;
      padding: 0.65rem 1rem;
      outline: none;
      font-family: inherit;
    }
    #lock-input:focus { border-color: #C9A35B; }
    #lock-error {
      font-size: 0.65rem;
      color: #c96161;
      letter-spacing: 0.08em;
      min-height: 1em;
    }
    #lock-btn {
      width: 100%;
      background: #C9A35B;
      color: #0c0c0c;
      border: none;
      padding: 0.65rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
    }
    #lock-btn:hover { opacity: 0.85; }

    :root {
      --bg:      #0c0c0c;
      --surface: #161616;
      --border:  rgba(201,163,91,0.2);
      --gold:    #C9A35B;
      --muted:   #9C988F;
      --ivory:   #F3EEE4;
      --red:     #c96161;
      --green:   #61c97a;
    }

    body {
      background: var(--bg);
      color: var(--ivory);
      font-family: 'Inter', 'Noto Sans KR', -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      padding: 2rem 1rem 4rem;
    }

    .wrap { max-width: 900px; margin: 0 auto; }

    /* Header */
    .page-header {
      text-align: center;
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .page-header h1 {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .page-header p {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.4rem;
      letter-spacing: 0.06em;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }
    .card--pat { border-color: rgba(201,163,91,0.4); }
    .card-title {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    /* Fields */
    .field-row {
      display: grid;
      grid-template-columns: 150px 1fr;
      align-items: center;
      gap: 0.5rem 1rem;
      margin-bottom: 0.7rem;
    }
    label { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.05em; }
    .field-group label {
      display: block;
      font-size: 0.62rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }

    input[type="text"],
    input[type="number"],
    input[type="password"],
    select {
      background: #0c0c0c;
      border: 1px solid rgba(201,163,91,0.22);
      color: var(--ivory);
      font-size: 0.8rem;
      padding: 0.45rem 0.7rem;
      width: 100%;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    input:focus, select:focus { border-color: var(--gold); }
    select option { background: #161616; }

    .pat-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem;
      align-items: center;
    }
    .pat-hint {
      font-size: 0.63rem;
      color: var(--muted);
      margin-top: 0.5rem;
      letter-spacing: 0.03em;
    }
    .pat-hint a { color: var(--gold); }

    /* Session blocks */
    .session-block { border: 1px solid var(--border); margin-bottom: 0.85rem; }
    .session-block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.7rem 1rem;
      background: rgba(201,163,91,0.04);
      cursor: pointer;
      user-select: none;
    }
    .session-block-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 0.08em;
    }
    .session-block-body { padding: 1.25rem; display: none; }
    .session-block.is-open .session-block-body { display: block; }

    .session-meta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    /* Participants */
    .participants-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 0.5rem;
    }
    .col-label {
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.55rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid rgba(201,163,91,0.1);
    }
    .participant-row {
      display: grid;
      grid-template-columns: 1fr 70px 28px;
      gap: 0.35rem;
      margin-bottom: 0.35rem;
      align-items: center;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      padding: 0.5rem 1rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      font-family: inherit;
      transition: opacity 0.15s;
    }
    .btn:hover:not(:disabled) { opacity: 0.75; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn--gold    { background: var(--gold); color: #0c0c0c; }
    .btn--outline { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .btn--red     { background: transparent; border: 1px solid rgba(201,97,91,0.35); color: var(--red);
                    font-size: 0.65rem; padding: 0.3rem 0.65rem; letter-spacing: 0.08em; }
    .btn--icon    { padding: 0.2rem 0.5rem; font-size: 1rem; font-weight: 400;
                    color: var(--muted); border: none; background: transparent; }
    .btn--sm      { padding: 0.35rem 0.7rem; font-size: 0.65rem; }
    .btn--full    { width: 100%; padding: 0.7rem; }
    .btn--add-p   { width: 100%; margin-top: 0.4rem; padding: 0.35rem; font-size: 0.65rem; }

    /* Action bar */
    .action-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    /* Status */
    .status-bar {
      display: none;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 1.25rem;
      margin-bottom: 1.25rem;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      border: 1px solid;
    }
    .status-bar.show { display: flex; }
    .status-bar--loading { border-color: rgba(201,163,91,0.3); color: var(--gold); background: rgba(201,163,91,0.05); }
    .status-bar--success { border-color: rgba(97,201,122,0.35); color: var(--green); background: rgba(97,201,122,0.05); }
    .status-bar--error   { border-color: rgba(201,97,91,0.35);  color: var(--red);   background: rgba(201,97,91,0.05); }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(201,163,91,0.3);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 620px) {
      .session-meta-grid { grid-template-columns: 1fr 1fr; }
      .participants-wrap  { grid-template-columns: 1fr; }
      .field-row          { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<!-- 비밀번호 잠금 화면 -->
<div id="lock-screen">
  <h1>2026 PRIVATE DATING</h1>
  <p>관리자 전용 페이지</p>
  <div id="lock-form">
    <input type="password" id="lock-input" placeholder="비밀번호" autocomplete="off" />
    <div id="lock-error"></div>
    <button id="lock-btn">입장</button>
  </div>
</div>

<!-- 관리자 콘텐츠 (잠금 해제 후 표시) -->
<div id="admin-content" style="display:none">
<script src="./assets/js/data.js"></script>
<script src="./assets/js/sessions.js"></script>

<div class="wrap">

  <header class="page-header">
    <h1>2026 PRIVATE DATING</h1>
    <p>관리자 — 편집 후 "GitHub에 저장" 버튼 한 번으로 사이트에 반영됩니다</p>
  </header>

  <!-- PAT (숨김 — URL에 ?setup 추가시 표시) -->
  <div class="card card--pat" id="pat-card" style="display:none">
    <h2 class="card-title">GitHub 연결 설정</h2>
    <div class="pat-row">
      <input type="password" id="pat-input" placeholder="GitHub Personal Access Token (ghp_...)" autocomplete="off" />
      <button class="btn btn--outline btn--sm" id="btn-pat-save">저장</button>
    </div>
    <p class="pat-hint">저장 후 이 브라우저에 영구 보관됩니다. URL에서 ?setup을 제거하면 칸이 다시 숨겨집니다.</p>
  </div>

  <!-- CONFIG -->
  <div class="card">
    <h2 class="card-title">기본 설정 (data.js)</h2>
    <div class="field-row">
      <label for="cfg-applyUrl">참가 신청 URL</label>
      <input type="text" id="cfg-applyUrl" placeholder="https://" />
    </div>
    <div class="field-row">
      <label for="cfg-formUrl">구글폼 URL</label>
      <input type="text" id="cfg-formUrl" placeholder="https://docs.google.com/forms/..." />
    </div>
    <div class="field-row">
      <label for="cfg-instagram">Instagram URL</label>
      <input type="text" id="cfg-instagram" placeholder="https://instagram.com/..." />
    </div>
    <div class="field-row">
      <label for="cfg-threads">Threads URL</label>
      <input type="text" id="cfg-threads" placeholder="https://threads.net/..." />
    </div>
  </div>

  <!-- SESSIONS -->
  <div class="card">
    <h2 class="card-title">세션 관리 (sessions.js)</h2>
    <div id="sessions-editor"></div>
    <button class="btn btn--outline btn--full" id="btn-add-session">+ 세션 추가</button>
  </div>

  <!-- Status & Action -->
  <div class="status-bar" id="status-bar">
    <div class="spinner" id="status-spinner"></div>
    <span id="status-text"></span>
  </div>

  <div class="action-bar">
    <button class="btn btn--outline" id="btn-preview">미리보기 (코드 확인)</button>
    <button class="btn btn--gold" id="btn-push">GitHub에 저장</button>
  </div>

  <!-- Preview (optional) -->
  <div class="card" id="preview-section" style="display:none">
    <h2 class="card-title">코드 미리보기</h2>
    <div style="margin-bottom:0.4rem;font-size:0.62rem;color:var(--gold);letter-spacing:0.1em">assets/js/data.js</div>
    <textarea class="code" id="out-data" readonly style="width:100%;background:#0c0c0c;border:1px solid rgba(201,163,91,0.15);color:#a8b8cc;font-family:monospace;font-size:0.72rem;line-height:1.55;padding:0.75rem 1rem;height:140px;resize:vertical;outline:none;"></textarea>
    <div style="margin:1rem 0 0.4rem;font-size:0.62rem;color:var(--gold);letter-spacing:0.1em">assets/js/sessions.js — SESSION_DATA 부분</div>
    <textarea class="code" id="out-sessions" readonly style="width:100%;background:#0c0c0c;border:1px solid rgba(201,163,91,0.15);color:#a8b8cc;font-family:monospace;font-size:0.72rem;line-height:1.55;padding:0.75rem 1rem;height:200px;resize:vertical;outline:none;"></textarea>
  </div>

</div>
</div> <!-- /admin-content -->

<script>
/* ── 비밀번호 잠금 ──────────────────────────── */
const ADMIN_PW = '55090076';

(function () {
  if (sessionStorage.getItem('admin_auth') === '1') {
    unlock();
    return;
  }
  const input = document.getElementById('lock-input');
  const btn   = document.getElementById('lock-btn');
  const err   = document.getElementById('lock-error');

  function tryUnlock() {
    if (input.value === ADMIN_PW) {
      sessionStorage.setItem('admin_auth', '1');
      unlock();
    } else {
      err.textContent = '비밀번호가 올바르지 않습니다.';
      input.value = '';
      input.focus();
    }
  }
  btn.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
  input.focus();
})();

function unlock() {
  document.getElementById('lock-screen').style.display  = 'none';
  document.getElementById('admin-content').style.display = 'block';
}

/* ── 상수 ───────────────────────────────────── */
const REPO   = 'compee-inc/2026-private-dating';
const BRANCH = 'main';
const STATUS_OPTIONS = ['RECRUITING','ALMOST_FULL','FULL','CLOSED','SOON'];
const DAY_OPTIONS    = ['MON','TUE','WED','THU','FRI','SAT','SUN'];

/* ── PAT 저장/로드 ──────────────────────────── */
const patInput = document.getElementById('pat-input');

/* ?setup 파라미터가 있을 때만 PAT 입력 칸 표시 */
if (location.search.includes('setup')) {
  document.getElementById('pat-card').style.display = 'block';
  const saved = localStorage.getItem('gh_pat');
  if (saved) patInput.value = saved;
  patInput.addEventListener('input', () => {
    const v = patInput.value.trim();
    if (v) localStorage.setItem('gh_pat', v);
  });
  document.getElementById('btn-pat-save').addEventListener('click', () => {
    const v = patInput.value.trim();
    if (!v) return;
    localStorage.setItem('gh_pat', v);
    showStatus('success', '저장 완료! URL에서 ?setup을 제거하면 칸이 숨겨집니다.');
    setTimeout(clearStatus, 3000);
  });
}

function getPAT() { return patInput.value.trim() || localStorage.getItem('gh_pat') || ''; }

/* ── 초기값 로드 ──────────────────────────── */
function init() {
  if (typeof CONFIG !== 'undefined') {
    document.getElementById('cfg-applyUrl').value  = CONFIG.applyUrl       || '';
    document.getElementById('cfg-formUrl').value   = CONFIG.formUrl        || '';
    document.getElementById('cfg-instagram').value = CONFIG.sns?.instagram || '';
    document.getElementById('cfg-threads').value   = CONFIG.sns?.threads   || '';
  }
  if (typeof SESSION_DATA !== 'undefined') {
    SESSION_DATA.forEach(s => appendSessionBlock(s));
  }
}

/* ── 세션 블록 생성 ───────────────────────── */
function appendSessionBlock(s) {
  const editor = document.getElementById('sessions-editor');
  const block  = document.createElement('div');
  block.className = 'session-block is-open';

  block.innerHTML = `
    <div class="session-block-header">
      <span class="session-block-title">${s.date || '새 세션'} (${s.day || ''}) · ${s.status || ''}</span>
      <button class="btn btn--red" onclick="deleteSession(this)">삭제</button>
    </div>
    <div class="session-block-body">
      <div class="session-meta-grid">
        <div class="field-group">
          <label>날짜 (MM.DD)</label>
          <input type="text" data-field="date" value="${s.date||''}" placeholder="10.05" oninput="updateTitle(this)" />
        </div>
        <div class="field-group">
          <label>요일</label>
          <select data-field="day" onchange="updateTitle(this)">
            ${DAY_OPTIONS.map(d => `<option${d===s.day?' selected':''}>${d}</option>`).join('')}
          </select>
        </div>
        <div class="field-group">
          <label>시간</label>
          <input type="text" data-field="time" value="${s.time||''}" placeholder="19:00" />
        </div>
        <div class="field-group">
          <label>장소</label>
          <input type="text" data-field="location" value="${s.location||''}" placeholder="서울 강남" />
        </div>
        <div class="field-group">
          <label>상태</label>
          <select data-field="status" onchange="updateTitle(this)">
            ${STATUS_OPTIONS.map(st => `<option${st===s.status?' selected':''}>${st}</option>`).join('')}
          </select>
        </div>
        <div class="field-group">
          <label>목표 인원 (남 / 여)</label>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.4rem">
            <input type="number" data-field="targetMen"   value="${s.targetMen??8}"   min="1" />
            <input type="number" data-field="targetWomen" value="${s.targetWomen??8}" min="1" />
          </div>
        </div>
      </div>
      <div class="participants-wrap">
        <div>
          <div class="col-label">MEN</div>
          <div class="p-list" data-gender="men">${(s.men||[]).map(p=>pRowHTML(p)).join('')}</div>
          <button class="btn btn--outline btn--add-p" onclick="addParticipant(this,'men')">+ 남성 추가</button>
        </div>
        <div>
          <div class="col-label">WOMEN</div>
          <div class="p-list" data-gender="women">${(s.women||[]).map(p=>pRowHTML(p)).join('')}</div>
          <button class="btn btn--outline btn--add-p" onclick="addParticipant(this,'women')">+ 여성 추가</button>
        </div>
      </div>
    </div>
  `;

  block.querySelector('.session-block-header').addEventListener('click', function(e) {
    if (e.target.closest('.btn--red')) return;
    block.classList.toggle('is-open');
  });
  editor.appendChild(block);
}

function pRowHTML(p) {
  return `<div class="participant-row">
    <input type="text"   class="p-occ" placeholder="직업/직군" value="${(p.occupation||'').replace(/"/g,'&quot;')}" />
    <input type="number" class="p-age" placeholder="나이"       value="${p.age??''}" min="20" max="65" />
    <button class="btn btn--icon" onclick="this.closest('.participant-row').remove()">×</button>
  </div>`;
}

function updateTitle(el) {
  const block = el.closest('.session-block');
  const date  = block.querySelector('[data-field="date"]').value   || '새 세션';
  const day   = block.querySelector('[data-field="day"]').value    || '';
  const st    = block.querySelector('[data-field="status"]').value || '';
  block.querySelector('.session-block-title').textContent = `${date} (${day}) · ${st}`;
}

/* ── 세션 추가 / 삭제 ──────────────────────── */
document.getElementById('btn-add-session').addEventListener('click', () => {
  appendSessionBlock({ id:'', date:'', day:'SUN', time:'19:00', location:'', status:'SOON', targetMen:8, targetWomen:8, men:[], women:[] });
  const blocks = document.querySelectorAll('.session-block');
  blocks.forEach(b => b.classList.remove('is-open'));
  const last = blocks[blocks.length - 1];
  last.classList.add('is-open');
  last.scrollIntoView({ behavior:'smooth', block:'start' });
});

function deleteSession(btn) {
  const block = btn.closest('.session-block');
  if (!confirm(`"${block.querySelector('.session-block-title').textContent}" 세션을 삭제할까요?`)) return;
  block.remove();
}

function addParticipant(btn, gender) {
  const list = btn.previousElementSibling;
  const div  = document.createElement('div');
  div.innerHTML = pRowHTML({ occupation:'', age:'' });
  list.appendChild(div.firstElementChild);
  list.lastElementChild.querySelector('.p-occ').focus();
}

/* ── 데이터 수집 ────────────────────────────── */
function collectConfig() {
  return {
    applyUrl:  document.getElementById('cfg-applyUrl').value.trim(),
    formUrl:   document.getElementById('cfg-formUrl').value.trim(),
    instagram: document.getElementById('cfg-instagram').value.trim(),
    threads:   document.getElementById('cfg-threads').value.trim(),
  };
}

function collectSessions() {
  return Array.from(document.querySelectorAll('.session-block')).map((block, i) => {
    const g    = f => block.querySelector(`[data-field="${f}"]`)?.value ?? '';
    const date = g('date');
    return {
      id:          date ? `2026-${date.replace('.', '-')}` : `session-${i+1}`,
      date,
      day:         g('day'),
      time:        g('time'),
      location:    g('location'),
      status:      g('status'),
      targetMen:   parseInt(block.querySelector('[data-field="targetMen"]')?.value)   || 8,
      targetWomen: parseInt(block.querySelector('[data-field="targetWomen"]')?.value) || 8,
      men:   collectParticipants(block, 'men'),
      women: collectParticipants(block, 'women'),
    };
  });
}

function collectParticipants(block, gender) {
  return Array.from(block.querySelectorAll(`.p-list[data-gender="${gender}"] .participant-row`))
    .map(row => ({
      occupation: row.querySelector('.p-occ').value.trim(),
      age:        parseInt(row.querySelector('.p-age').value) || null,
    }))
    .filter(p => p.occupation);
}

/* ── 코드 생성 ─────────────────────────────── */
function buildDataJS(cfg) {
  return `/* ============================================================
   data.js — 사이트 기본 설정
   ============================================================ */

const CONFIG = {

`;

function buildSessionDataStr(ses) {

}

/* ── GitHub API ────────────────────────────── */
function toBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}

function fromBase64(b64) {
  const binary = atob(b64.replace(/\n/g, ''));
  const bytes  = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

async function ghFetch(token, path, options = {}) {
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
    ...options,
    headers: {
      Authorization: `Bearer ${token}`,
      Accept: 'application/vnd.github+json',
      'Content-Type': 'application/json',
      ...(options.headers || {}),
    },
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `HTTP ${res.status}`);
  }
  return res.json();
}

async function getFileSHA(token, path) {
  const data = await ghFetch(token, `${path}?ref=${BRANCH}`);
  return { sha: data.sha, content: fromBase64(data.content) };
}

async function updateFile(token, path, newContent, sha, commitMsg) {
  await ghFetch(token, path, {
    method: 'PUT',
    body: JSON.stringify({
      message: commitMsg,
      content: toBase64(newContent),
      sha,
      branch: BRANCH,
    }),
  });
}

/* ── GitHub에 저장 ─────────────────────────── */
document.getElementById('btn-push').addEventListener('click', async () => {
  const token = getPAT();
  if (!token) {
    showStatus('error', 'GitHub PAT를 먼저 입력하고 저장하세요.');
    return;
  }

  const btn = document.getElementById('btn-push');
  btn.disabled = true;
  showStatus('loading', 'GitHub에 저장 중...');

  try {
    const cfg = collectConfig();
    const ses = collectSessions();

    /* data.js 전체 교체 */
    showStatus('loading', 'data.js 업데이트 중...');
    const { sha: dataSHA } = await getFileSHA(token, 'assets/js/data.js');
    await updateFile(token, 'assets/js/data.js', buildDataJS(cfg), dataSHA, 'update data.js via admin');

    /* sessions.js — SESSION_DATA 부분만 교체 */
    showStatus('loading', 'sessions.js 업데이트 중...');
    const { sha: sesSHA, content: sesContent } = await getFileSHA(token, 'assets/js/sessions.js');
    const newSesContent = sesContent.replace(
      /const SESSION_DATA = \[[\s\S]*?\n\];/,
      buildSessionDataStr(ses)
    );
    await updateFile(token, 'assets/js/sessions.js', newSesContent, sesSHA, 'update SESSION_DATA via admin');

    showStatus('success', '저장 완료! GitHub Pages 반영까지 약 1분 소요됩니다.');
  } catch (e) {
    showStatus('error', `오류: ${e.message}`);
  } finally {
    btn.disabled = false;
  }
});

/* ── 상태 표시 ─────────────────────────────── */
function showStatus(type, msg) {
  const bar     = document.getElementById('status-bar');
  const spinner = document.getElementById('status-spinner');
  const text    = document.getElementById('status-text');
  bar.className = `status-bar show status-bar--${type}`;
  spinner.style.display = type === 'loading' ? 'block' : 'none';
  text.textContent = msg;
}

function clearStatus() {
  document.getElementById('status-bar').className = 'status-bar';
}

/* ── 시작 ──────────────────────────────────── */
init();
